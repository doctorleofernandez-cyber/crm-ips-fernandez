<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio | IPS Fernández O&M</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --dorado: #C9A84C; --dorado-claro: #e2c47a; --blanco: #fff; --gris: #888; }
    body {
      background-color: #000; font-family: 'Inter', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; color: var(--blanco);
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, #1a1400 0%, #000 60%);
      z-index: 0;
    }
    .wrap { position: relative; z-index: 1; width: 100%; max-width: 820px; text-align: center; }

    .header { margin-bottom: 38px; }
    .header img { width: 96px; height: auto; margin: 0 auto 14px; display: block; filter: drop-shadow(0 0 16px rgba(201,168,76,0.25)); }
    .header h1 { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; }
    .header h1 span { color: var(--dorado); }
    .header p { margin-top: 8px; font-size: 13px; color: var(--gris); letter-spacing: 1px; }
    .saludo { margin-top: 16px; font-size: 15px; color: var(--dorado-claro); }

    .modulos { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

    .modulo {
      background: #16140e; border: 1px solid rgba(201,168,76,0.25);
      border-radius: 18px; padding: 34px 26px; cursor: pointer;
      text-decoration: none; color: var(--blanco);
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .modulo:hover { transform: translateY(-4px); border-color: rgba(201,168,76,0.6); box-shadow: 0 16px 40px rgba(201,168,76,0.12); }
    .modulo-icon { font-size: 50px; line-height: 1; }
    .modulo-nombre { font-family: 'Playfair Display', serif; font-size: 21px; font-weight: 700; color: var(--dorado); }
    .modulo-desc { font-size: 13px; color: #b8ad95; line-height: 1.5; max-width: 260px; }

    .salir { margin-top: 30px; }
    .salir a { font-size: 12.5px; color: var(--gris); text-decoration: none; transition: color 0.2s; }
    .salir a:hover { color: var(--dorado); }

    @media (max-width: 680px) {
      .modulos { grid-template-columns: 1fr; gap: 14px; }
      .modulo { padding: 28px 20px; }
      .header img { width: 78px; }
      .header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <img src="assets/logo.png" alt="IPS Fernández O&M" onerror="this.style.display='none'" />
      <h1>IPS Fernández <span>O&M</span></h1>
      <p>SISTEMA DE GESTIÓN</p>
      <div class="saludo" id="saludo"></div>
    </div>

    <div class="modulos">
      <a class="modulo" id="moduloCRM" href="dashboard.html">
        <div class="modulo-icon">📊</div>
        <div class="modulo-nombre">CRM Comercial</div>
        <div class="modulo-desc">Leads, pipeline, citas, chat y reportes comerciales.</div>
      </a>
      <a class="modulo" id="moduloFact" href="facturacion.html">
        <div class="modulo-icon">🧾</div>
        <div class="modulo-nombre">Facturación</div>
        <div class="modulo-desc">Facturas, pagos y reportes financieros de la clínica.</div>
      </a>
    </div>

    <div class="salir">
      <a href="#" onclick="cerrarSesion(); return false;">→ Cerrar sesión</a>
    </div>
  </div>

  <script src="sidebar.js?v=11"></script>
  <script>
    // Exige sesión (si no hay, sidebar.js ya redirige; reforzamos por si acaso)
    (function () {
      var sesion = localStorage.getItem('crm_sesion') || sessionStorage.getItem('crm_sesion');
      if (!sesion) { location.replace('index.html'); return; }

      // Saludo con el usuario actual
      try {
        var uid = localStorage.getItem('crm_usuario') || sessionStorage.getItem('crm_usuario');
        var users = JSON.parse(localStorage.getItem('usuarios_sistema') || '[]');
        var u = users.filter(function (x) { return x.id === uid; })[0];
        if (u) document.getElementById('saludo').textContent = 'Hola, ' + u.nombre + ' 👋';

        // Mostrar cada módulo solo si el usuario tiene permiso
        if (u && u.permisos) {
          if (!u.permisos.facturacion) document.getElementById('moduloFact').style.display = 'none';
          if (!u.permisos.dashboard && !u.permisos.contactos) document.getElementById('moduloCRM').style.display = 'none';
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
